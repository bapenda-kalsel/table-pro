<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="tp-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181F" />
      <stop offset="100%" stop-color="#0E0E11" />
    </linearGradient>
    <linearGradient id="tp-rim" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3F3F46" />
      <stop offset="100%" stop-color="#222228" />
    </linearGradient>
    <linearGradient id="tp-accent" x1="256" y1="212" x2="408" y2="316" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
  </defs>

  <!-- Outer Machined Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tp-bg)" stroke="url(#tp-rim)" stroke-width="8" />
  <!-- Subtle Inner Bezel -->
  <rect x="36" y="36" width="440" height="440" rx="94" stroke="#2DD4BF" stroke-opacity="0.12" stroke-width="2" />

  <!-- Subtle Structural Grid Hairlines -->
  <line x1="104" y1="192" x2="408" y2="192" stroke="#27272A" stroke-width="2" stroke-dasharray="6 6" />
  <line x1="236" y1="104" x2="236" y2="408" stroke="#27272A" stroke-width="2" stroke-dasharray="6 6" />

  <!-- 1. Table Schema Header Bar (Crossbar of 'T') -->
  <rect x="104" y="104" width="304" height="68" rx="18" fill="#F4F4F5" />
  <!-- Primary Key Slot Cutout inside Header -->
  <rect x="128" y="128" width="44" height="20" rx="6" fill="#0E0E11" />
  <circle cx="372" cy="138" r="10" fill="#0D9488" />

  <!-- 2. Primary Key Column Stem (Vertical Spine of 'T' and 'P') -->
  <rect x="148" y="196" width="72" height="212" rx="18" fill="#F4F4F5" />

  <!-- 3. Active Relational Cell (Bowl of 'P' in Calibrated Verdigris) -->
  <rect x="244" y="196" width="164" height="96" rx="22" fill="url(#tp-accent)" />
  <rect x="272" y="234" width="84" height="20" rx="6" fill="#042F2E" fill-opacity="0.75" />

  <!-- 4. Secondary Data Cell (Completing the Relational Matrix) -->
  <rect x="244" y="316" width="112" height="92" rx="18" fill="#1C1C24" stroke="#2DD4BF" stroke-opacity="0.45" stroke-width="6" />
  <circle cx="300" cy="362" r="12" fill="#2DD4BF" />
</svg>
